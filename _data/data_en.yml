career-profile:
    title: Career Profile
    summary: |
      DevOps Engineer, SRE, and Cloud Architect with 4 years of experience, specializing in the design and automation of highly secure, multi-datacenter, and multi-cluster infrastructures. With expertise spanning from bare-metal (L1) to application layers (L7), I apply Zero-Trust principles and IaC to deliver reliable environments compliant with the most stringent industry standards (ISO 27001). Passionate about innovation (AI, automation), I enjoy working in teams to boost collective efficiency.

