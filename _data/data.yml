experiences:
  title: Work and Research Experience
  info:
  - role: Summer Intern
    time: June 2026 - Present
    company: SAG, Defense Research and Development Organization, India
    details: |
      Working at Scientific Analysis Group in DRDO, New Delhi. Working under the guidance of scientist, Devendra KY.
      - Modified and extended the CHSH algorithm from my bachelor’s thesis to 7, 15 and 50 node meshes.
      - Analysing shortcomings of simple routing algorthitms.
      - Studying key papers on routing protocols, purification metrics and path selection policies.
      - Working on purification based routing algorithm implementation on a dynamic mesh (PRESENT
  - role: Co-Author and Research Assistant
    time: March 2026 - May 2026
    company: Fujitsu Quantum Simulator Challenge
    details: |
        - Worked in a multidisciplinary team to execute 16-qubit simulations on IQM’s Sirius 24-qubit 
        superconducting processor, mapping the 2D potential energy surface (32 × 32 grid) of H2O
        - Co-authored a research article demonstrating the integration of Density Matrix Embedding Theory
        (DMET) in fragment-based molecular simulations to scale them according to industrial limits while
        maintaining chemical accuracy
        - Formulated a comprehensive literature review on Sample-based Quantum Diagonalization (SQD)
        frameworks, establishing the theoretical baseline for the molecular electronic structure simulations
        - We evaluated the ansatz expressivity and gate-depth trade-offs between hardware-efficient LUCJ and
        chemically motivated LCNot-UCCSD.
  - role: Bachelor Thesis
    time: August 2025 - May 2026
    company: Kirori Mal College, University of Delhi
    details: |
      Working under supervision of Prof. Bipin Singh Koranga.
        - Thesis has two investigative projects: 1) simulation and modelling of errors, vulnerabilities and
        mitigation strategies in BB84, and 2) modelling E91-based entanglement network and a simple quantum
        routing algorithm.
        - Developed BB84 protocol simulations in Python to establish error-free baseline QBER, quantify channel
        attenuation and single-photon detector (SPD) noise, and model pulse vulnerabilities under Photon
        Number Splitting (PNS) attacks.
        - Evaluated error mitigation strategies for BB84 using decoy-state protocols, and developed a Multi-Layer
        Perceptron (MLP) machine learning model in Python to eliminate environmental drift in CVQKD
        systems.
        - Learned quantum networking concepts, including entanglement swapping topologies, quantum
        memory, state purification mechanics, and localized fidelity tracking.
        - Built discrete-event simulations in NetSquid to model a) quantum teleportation, b) E91-CHSH
        verification loops, and c) Centralized CHSH Bottleneck Routing algorithm utilizing max-min graph
        optimization for a simple 5-node mesh.
        - Skills: Quantum Key Distribution, Quantum Networks, Python, Qiskit, NetSquid, Machine Learning

