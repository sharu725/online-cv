certifications:
  title: Certifications
  list:
  - name: ASP.net
    start: 2015
    end: 2015
    organization: educentre
    credentialid: 
    credentialurl: 
    credentialname: 
    details: |
    E-Commerce Inventory Management System	[ASP.NET Core MVC, C#, SQL Server, EF Core]
    Developed a full-stack, secure web application to automate inventory tracking and reporting.	
    Backend: Built on ASP.NET Core MVC using C#; utilized Entity Framework Core for efficient data access and management with SQL Server.	
    Functionality: Designed and implemented user authentication and Role-Based Access Control (RBAC) using ASP.NET Identity.	
    Database: Created a normalized database schema and wrote complex SQL queries and stored procedures for real-time reporting.	
    Result: Improved inventory accuracy and reduced manual error rates by 20%, demonstrating proficiency in the complete ASP.NET development lifecycle.
  - name: Robotics
    start: 2014
    end:
    organization: 
    credentialid: 
    credentialurl: 
    credentialname: 
    details: |
      "Designed and built an autonomous line-following robot using an Arduino Uno and IR sensors. 
      I programmed the control logic in C++ to process sensor data and manage a dual-motor
      drive system via an L298N motor driver. The robot successfully navigated complex, winding tracks without deviation."
