  info:
    - role: Senior Python Engineer
      time: 2025-06 - Present
      company: Endava, Romania
      details: |
        - Drive the modernisation and productionisation of Python applications and data products for a leading global energy and commodities trading organisation, covering application migration, refactoring, deployment, security, and operational readiness.
        - Enable Risk Analysts, Quant Developers, and other citizen developers to build and productionise Python-based analytics applications, data pipelines, and internal data products.
        - Refactor legacy Python applications and pipelines to improve maintainability, reliability, performance, testability, and alignment with software engineering best practices.
        - Migrate Python workloads from legacy and desktop-oriented environments to containerised, production-grade platforms based on Docker and Kubernetes.
        - Design and implement data and application workflows using Kubernetes, Argo Workflows, ArgoCD, and Dagster, including CI/CD and GitOps-based deployment patterns.
        - Modernise authentication and application security by integrating OIDC, OAuth 2.0, SSO, Entra ID, and Vault into existing Dash, Dash Enterprise, and Flask applications.
        - Support the migration of business-critical applications while maintaining compatibility with existing environments and establishing validation and regression-testing approaches to ensure functional equivalence.
        - Work closely with Risk, Quant, Engineering, DevOps, and business stakeholders to define technical requirements, resolve dependencies and production blockers, and coordinate application releases.
        - Contribute to platform and DevOps activities including containerisation, Kubernetes deployment configuration, secrets management, environment configuration, and production troubleshooting.
