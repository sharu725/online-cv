experiences:
  title: Experiences
  info:
    - role: Tech Advisor
      time: 2026 - Present
      company: ICONSULTING
      link: "https://www.iconsulting.com/"
      details: |
        Driving the definition and implementation of data architecture solutions across client engagements, 
        guiding development teams through implementation phases in line with quality standards and delivery best practices.

        Led and executed several initiatives, including:
        - Defining target data architectures and technical roadmaps aligned with client business requirements
        - Working across diverse technology stacks and code-based data platform scenarios, adapting architectural and implementation approaches to different client contexts
        - Taking part in requirements deep-dive activities to gain a clearer understanding of functional needs and ensure a coherent, well-aligned implementation output
        
    - role: Senior Data Platform Engineer
      time: 2025 - 2026
      company: LocalStack
      link: "https://localstack.cloud"
      details: |
        Contributed to the development, maintenance, and evolution of large-scale real-time data ingestion pipelines,
        ensuring reliable and efficient data flow across the organization.

        Led and executed key initiatives, including:
        - Maintaining and enhancing large-scale data ingestion solutions
        - Designing and implementing analytics and reporting tools for internal stakeholders
        - Supporting product engineering and resolving critical issues
        - Leading vendor and tool selection to implement a new data platform

    - role: Data Engineering Manager
      time: 2020 - 2024
      company: Cloud Academy
      link: "https://cloudacademy.com/"
      details: |
        Led the creation, growth, and mentoring of the Data Engineering & Analytics team, driving initiatives that transformed how data was leveraged to support business decisions and enterprise customer analytics needs.

        Designed, implemented, and evolved the Data Engineering infrastructure to ingest, process, and transform data from multiple sources, ensuring accurate and timely delivery to stakeholders and clients.

        Championed best practices across the data platform, including:
        - Data Lake & Warehouse architecture and implementation
        - Scalable data modeling, pipelines, and integrated data quality monitoring
        - Dashboard development and analytics enablement for internal and external stakeholders

        Led strategic initiatives to build and scale the team and capabilities, including:
        - Hiring, mentoring, and developing Data Engineers and Analysts
        - Defining career frameworks and managing enterprise data requirements
        - Selecting and deploying analytics tools while training stakeholders on BI platform adoption

        Partnered with Engineering, Product, and Content teams to define and operationalize key business metrics, unify data sources into a single source of truth, and establish robust KPI tracking for product usage and content engagement.

        Through these initiatives, drove a culture of data excellence, quality, and actionable insights across the organization.

    - role: Data Governance Manager
      time: 2018 - 2020
      company: Cuebiq
      link: "https://www.cuebiq.com/"
      details: |
        Founded and led the Data Quality Team, partnering with Product Data Owners to define, implement, and monitor Data Quality indicators.  

        Enabled Product teams to gain actionable insights and effectively manage the quality of multiple data products.

        Directed the technical implementation and deployment of key solutions, including:
        - Data Catalog solution adopted by 150+ users to efficiently discover dataset information and metadata essential for their work.
        - Corporate Data Warehouse as the single source of truth for certified, high-quality, and trusted data,
        supporting analysis, reporting, and company performance monitoring.

        Through these initiatives, strengthened data governance, improved data reliability,
        and empowered teams to make data-driven decisions with confidence.

    # - role: Chief Data Officer
    #   time: 2017 - 2018
    #   company: Linear Assicurazioni
    #   link: "https://www.linear.it/"
    #   details: |
    #     Led the Data Center & BI Team in developing and maintaining analytics solutions to monitor company performance,
    #     with a focus on revenue from car and life insurance products.
        
    #     Partnered with the Head of IT, General Manager, and senior management to define and implement the long-term data strategy,
    #     ensuring analytics initiatives aligned with business goals and
    #     supported data-driven decision-making across the organization.

    - role: Senior Solution Designer & Analyst
      time: 2013 - 2017
      company: ICONSULTING
      link: "https://www.iconsulting.com/"
      details: |
        Led the design, implementation, and optimization of Business Analytics solutions for a diverse client base,
        including multinational holdings, banks, B2C and B2B companies, and fashion brands.

        Focused on the technical delivery of projects, including ETL and BI solution design,
        development team management, and ensuring high-quality implementation. Partnered with clients on business-facing activities such as
        functional analysis, requirements definition, and user acceptance testing (UAT).

        Delivered regular technical training sessions for team members and clients,
        fostering knowledge transfer, skill development, and adoption of best practices.

    - role: Other roles
      time: 2010 - 2013, 2017 - 2018
      company: CINECA, CSP S.p.a., Linear Assicurazioni

