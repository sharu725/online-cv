experiences:
    title: Experiences
    info:
      - role: Cloud Architect
        time: Juillet 2023 - Présent
        company: S3ns / Thales, Paris
        details: |
          Chez S3ns, filiale de Thales en partenariat avec Google Cloud. Conception et sécurisation d'architectures cloud souveraines de pointe.
          * **Automatisation & IaC :** Conception de modules Terraform et de scripts Python réutilisables pour automatiser les déploiements complexes. Réduction des procédures d'infrastructure à une commande unique, optimisant le temps d'ingénierie et améliorant la résilience du système.
          * **Kubernetes Multi-Cluster & Multi-Datacenter :** Déploiement d'une infrastructure cloud on-premise (bare-metal) complète, de la couche physique L1 aux applications L7. Déploiement de Kubernetes sur 3 datacenters distincts via Cilium Cluster Mesh pour garantir une interconnexion inter-cluster fluide et sécurisée.
          * **Sécurité Zero-Trust & Conformité ISO 27001 :** Mise en œuvre de mTLS systématique pour tous les flux inter-pod et inter-datacenter. Rédaction d'ADR (Architecture Decision Records) et collaboration avec les équipes de cybersécurité pour s'aligner sur les standards ISO 27001 et automatiser la validation des flux.
          * **Optimisation de workflows & IA :** Intégration et standardisation de Gemini dans les processus de l'équipe pour accélérer le delivery et accroître l'autonomie.
      - role: Ingénieur DevOps alternant
        time: 2021 - 2022
        company: Ercom / Thales, Paris
        details: |
          Chez Ercom, filiale de Thales, DevOps dans une équipe de 6 personnes pour des solutions sécurisées de 
          messagerie et de partage de fichiers, à vocation d’être certifiées par l’ANSSI.
      - role: Ingénieur sécurité pour solution de messagerie collaborative
        time: 2021
        company: Thales SIX GTS, Paris
        details: |
          Stage de M1 chez Thales dans l’équipe de cybersécurité pour une solution de messagerie sécurisée.
projects:
    title: Projets
    assignments:
      - title: Mutualisation de ressources cloud / kubernetes
        tagline: |
          Mutualisation de ressources Kubernetes pour l'application Citadel Team tout en garantissant le même niveau de sécurité afin
          de diminuer le nombre de VMs nécessaire et faciliter grandement les opérations sur les clusters des clients. Lien étroit avec 
          l'équipe de QA. Rédaction de documentation, déploiements d'environnements de test, rédaction de procédures de test.
      - title: Maintien en condition opérationnelle / patching des infrastructures clientes
        tagline: Dépannage des infrastructures Citadel Team des clients
      - title: Déploiement / mise à l’échelle / monitoring d’infrastructures cloud pour les clients Citadel Team
        tagline: Création, scaling et monitoring des infrastructures clientes
      - title: Mise à jour de scripts de déploiement d'infrastructure client
        tagline: |
          Suite à des mises à jour de l'API du cloud provider (OVH), adapter les scripts de déploiement de VMs. 
      - title: Évolution des infrastructures clientes existantes
        tagline: |
          afin de faciliter les opérations de maintenance et de déploiement. 
          Recherche et tests de solutions à la problématique
          Garantir le même niveau de sécurité (certificats mTLS entre micro-services, application de la philosophie "zero trust")
      - title: Déploiement d'un outil d'analyse de logs
        tagline: |
          Détection de comportement suspicieux grâce à de l'analyse de logs en utilisant ElasticSearch dans l'équipe cybersécurité. L'objectif est de prévenir
          une attaque en bloquant l'utilisateur froduleux.
      - title: Architecture réseau & VPN sécurisés (Projet Personnel)
        tagline: |
          Mise en place d'architectures réseau personnalisées et sécurisées basées sur WireGuard.
      - title: Automatisation de workflows & Intégrations (Projet Personnel)
        tagline: |
          Conception et déploiement de pipelines d'automatisation de tâches et d'intégration de services en utilisant l'outil n8n.

