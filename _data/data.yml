experiences:
    title: Experiences
    info:
    - role: Senior Research and Development Engineer
      time: Jul 2025 - Present
      company: Synopsys Inc, Córdoba, Spain (remote)
      details: |
          Continuation of my Ansys role following Synopsys' acquisition of Ansys (July 2025). Main maintainer of [PyMAPDL](https://github.com/ansys/pymapdl), the open-source Python interface to the MAPDL solver (500+ GitHub stars, 17,000+ monthly downloads).

          - **PyMAPDL MCP:** designed and developed the [PyMAPDL MCP](https://github.com/ansys/pymapdl-mcp) server, letting AI assistants and agents drive MAPDL simulations directly (3,000+ monthly downloads)
          - **PyMAPDL development:** drove major growth of the library, including a new command-line interface (CLI), new and improved features, and extensive documentation improvements
          - **C++ & gRPC:** design and implement features in the C++ gRPC server inside the MAPDL solver and in the Python client that drives it
          - **Docker:** redesigned the MAPDL Docker images, cutting image size by up to 10x and improving startup and execution times; built and maintain multiple image variants for different product combinations and Ubuntu versions
          - **CI/CD:** reworked PyMAPDL's CI/CD pipelines for faster runs, reproducible builds and fewer failures
          - **Testing:** raised PyMAPDL test coverage from 70% to 90%
          - **Releases & collaboration:** own the maintenance cycle from GitHub issue triage to patch releases; improved versioning, documentation and release QA; work with HPC, backend and solver teams; mentor colleagues on Python, Docker and gRPC

    - role: Senior Research and Development Engineer
      time: Apr 2023 - Jul 2025
      company: Ansys, Remote, Spain
      details: |
          - Main maintainer of PyMAPDL: gRPC API development for the Python-C++ interface; improved the MAPDL codebase and its gRPC interface
          - Built CI/CD pipelines with GitHub Actions for automated testing and deployment
          - Built and maintained the [MAPDL solver Ubuntu Docker image](https://github.com/ansys/pymapdl/pkgs/container/pymapdl%2Fmapdl) for CI and cloud deployment
          - Managed 200+ issues/PRs with documentation and code reviews
          - Mentored engineers and supported customer engagements

    - role: Research and Development Engineer
      time: Sep 2021 - Apr 2023
      company: Ansys, Córdoba, Spain
      details: |
          - Core contributor to the PyAnsys ecosystem: developed Python libraries including [PyMAPDL](https://github.com/ansys/pymapdl), [ansys/actions](https://github.com/ansys/actions), [ansys-tools-path](https://github.com/ansys/ansys-tools-path) and [ansys-sphinx-theme](https://github.com/ansys/ansys-sphinx-theme)
          - Implemented gRPC-based APIs for client-server communication
          - Built automated testing frameworks and CI/CD pipelines; developed and improved the MAPDL Docker image for internal use and testing
          - Created developer tools and documentation; promoted coding best practices across the team

    - role: Research Officer in Data Science
      time: Aug 2020 - Aug 2021
      company: Medical School, Swansea University, Swansea, UK
      details: |
          - Applied machine learning (clustering and deep learning) to detect outliers and abnormal behaviour in cardiac cell optical data and fluorescent calcium measurements
          - Extracted image features with ML; processed proprietary microscope file formats
          - Built an in-house Python GUI workflow for microscope image analysis and data extraction

    - role: Research Fellow, Materials Modelling and Machine Learning
      time: Nov 2019 - Aug 2020
      company: Institute of Materials Discovery, University College London, London, UK
      details: |
          - Co-developed an EU-funded web platform giving industry access to materials modelling expertise (partners included Fraunhofer, Enthought and Bosch)
          - Applied FEM and neural networks to predict and optimise properties of industrial composites (honeycomb, recycled aggregates); contributed to text mining of research databases
          - Co-supervised master's projects on optimising industrial composites

    - role: Project Officer
      time: Jul 2018 - Oct 2019
      company: ASTUTE 2020, Swansea University, Swansea, UK
      details: |
          - Developed a Python/JavaScript add-on integrated into the Ansys user interface to simplify continuum mechanics calculations
          - Applied data science (neural networks, multi-constraint optimisation) to reduce costs in steel manufacturing
          - Built scripts to analyse machinery performance data and numerical models to improve manufacturing processes

