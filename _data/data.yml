experiences:
  title: Experience
  info:
  - role: Graduate Research Assistant
    time: 2025 - present
    company: Advanced Computing and Oncology Lab, Sloan Kettering Institute, Memorial Sloan Kettering Cancer Center
    details: |
      Lead conceptual development and computational strategy for translational studies of tumor-host interaction, immune remodeling, thymic composition, treatment toxicity, and lung cancer outcomes.

      - Develop multimodal analysis frameworks integrating thoracic CT, radiation dose, clinical outcomes, targeted sequencing, circulating tumor DNA, RNA-seq, flow cytometry, cytokine profiling, and immune validation assays.
      - Build spatial and single-cell workflows for atlas mapping, spatial deconvolution, cell-state annotation, cell-cell communication, and interpretation of inflammatory, stromal, epithelial, and immune programs.
      - Contribute to cross-group collaborations in computational oncology, systems immunology, and translational biology, including single-cell RNA-seq analysis of secondary lymphedema.
      - Generate publication-grade figures, statistical analyses, reproducible workflows, abstracts, and manuscript-ready results; contribute as co-first author and primary quantitative analyst on translational studies.

  - role: Medical / Laboratory Assistant
    time: 2023 - 2024
    company: The Center for Skin Surgery, Cornwall, NY
    details: |
      Supported Mohs micrographic surgery workflow, clinical documentation, tissue handling, and dermatopathology preparation for squamous and basal cell carcinoma cases.

      - Prepared frozen tissue sections and H&E-stained slides.
      - Assisted with immunohistochemistry-associated workflows and surgical pathology review preparation.

  - role: Honors Thesis Research
    time: Jan - Jul 2023
    company: Department of Biology, Yeshiva University
    details: |
      Analyzed TCGA and GEO transcriptomic datasets in R and Bioconductor to study tumor immune microenvironment programs in head and neck squamous cell carcinoma, with emphasis on cancer-associated fibroblast and cancer stem-like cell states.

      - Integrated differential expression, pathway enrichment, survival analysis, cell-cell communication evidence, and structural biology context to prioritize candidate antibody-drug conjugate targets.

  - role: Research Assistant
    time: 2019
    company: Bruckner Oncology, Bronx, NY
    details: |
      Built and maintained a clinical oncology research database, performed retrospective survival analyses, and contributed to peer-reviewed studies of prognostic factors and treatment outcomes in gastrointestinal cancers.

