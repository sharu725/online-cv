career-profile:
  title: Bio
  summary: |
    I'm a computational biologist developing multimodal methods for cancer systems biology, spatial and single-cell analysis, immune profiling, and translational biomarker discovery. My research focuses on tumor-host interactions, cell-state transitions, immune remodeling, and the integration of genomics, spatial transcriptomics, imaging, and clinical outcomes.

    I am an M.S. candidate in Bioinformatics at Johns Hopkins University and a Graduate Research Assistant in the Advanced Computing and Oncology Laboratory at Memorial Sloan Kettering Cancer Center. My thesis work, StageBridge, develops receiver-centered niche encoding for modeling cell-state transitions from cross-sectional single-cell and spatial data.

    The through-line in my work is using computational models to connect molecular state, tissue architecture, immune context, and clinically meaningful phenotypes. I am especially interested in methods that make tumor ecosystems interpretable rather than treating epithelial, stromal, immune, genomic, imaging, and clinical data as disconnected layers.

projects:
  title: What I'm working on
  intro: >
    Current work centers on spatial systems biology, tumor-immune niche modeling, multimodal translational oncology, and interpretable machine-learning methods for cancer progression and treatment response.
  assignments:
  - title: StageBridge
    link: "https://github.com/SecondBook5/StageBridge"
    tagline: "Receiver-centered niche encoding for cell-state transitions from cross-sectional single-cell and spatial data. StageBridge integrates spatial transcriptomics, single-nucleus RNA-seq, whole-exome sequencing, and dual-reference atlas context to connect epithelial transition dynamics with local immune, stromal, pathway, and genomic programs."

  - title: Tumor-host immune remodeling from imaging and molecular data
    link: "#"
    tagline: "Multimodal analysis frameworks integrating thoracic CT, radiation dose, clinical outcomes, targeted sequencing, circulating tumor DNA, RNA-seq, flow cytometry, cytokine profiling, myeloid-derived suppressor cell measurements, and immune validation assays."

  - title: Spatial and single-cell tumor ecosystem analysis
    link: "#"
    tagline: "Workflows for atlas mapping, spatial deconvolution, cell-state annotation, cell-cell communication, and interpretation of inflammatory, stromal, epithelial, and immune programs across tumor microenvironments."

  - title: Translational biomarker discovery
    link: "#"
    tagline: "Reproducible computational pipelines, publication-grade figures, statistical analyses, and manuscript-ready results for oncology studies linking molecular state, immune context, tissue composition, and clinical outcome."

