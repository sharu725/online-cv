career-profile:
  title: Bio
  summary: |
    I'm a computational biologist interested in systems immunology and multimodal models of tissue state. My work uses genomics, epigenomics, spatial transcriptomics, spatial proteomics, computational pathology, medical imaging, and clinical outcomes to study how cellular systems organize, transition, and fail across disease contexts.

    I am an M.S. candidate in Bioinformatics at Johns Hopkins University and a Graduate Research Assistant in the Advanced Computing and Oncology Laboratory at Memorial Sloan Kettering Cancer Center. My current thesis project, [StageBridge](https://github.com/SecondBook5/StageBridge), models cell-state transitions from cross-sectional single-cell and spatial data using receiver-centered niche encoding, optimal transport, and conditional flow matching.

    Cancer is my main current application area, but not my only scientific identity. The broader problem that motivates me is how to build interpretable computational systems that connect molecular regulation, tissue architecture, immune context, and phenotype across modalities. I am especially drawn to methods that bridge systems biology, spatial biology, and machine learning while remaining biologically testable.

current-focus:
  title: What I'm thinking about
  items:
  - title: Systems immunology across tissue contexts
    description: I am interested in how immune systems organize across space, time, and perturbation, including how inflammatory, stromal, epithelial, and myeloid programs reshape local tissue behavior.
  - title: Spatial omics and computational pathology
    description: I want to connect spatial transcriptomics, spatial proteomics, histology, imaging, and molecular data so tissue structure can be studied as a coordinated biological system rather than as separate assays.
  - title: Cell-state transitions and disease progression
    description: I am drawn to methods that infer how cell states move between biological regimes, especially when longitudinal data are limited and spatial context may make cross-sectional data more informative.
  - title: Interpretable multimodal modeling
    description: My goal is not just to build high-performing models, but to build models that generate biologically testable hypotheses about regulation, communication, immune remodeling, and phenotype.

projects:
  title: Current projects
  intro: >
    Current work focuses on systems immunology, spatial biology, multimodal data integration, and interpretable models of cell-state transition and tissue organization.
  assignments:
  - title: StageBridge
    link: "https://github.com/SecondBook5/StageBridge"
    tagline: "Receiver-centered niche encoding for cell-state transitions from cross-sectional single-cell and spatial data. StageBridge integrates spatial transcriptomics, single-nucleus RNA-seq, whole-exome sequencing, and dual-reference atlas context to connect epithelial transition dynamics with local immune, stromal, pathway, genomic, and tissue-neighborhood programs."

  - title: Spatial deconvolution and atlas-sensitivity benchmarking
    link: "#"
    tagline: "Benchmarking how deconvolution method choice and reference atlas choice change downstream biological conclusions in spatial transcriptomics, with emphasis on tissue-level interpretation rather than accuracy metrics alone."

  - title: Multimodal systems immunology workflows
    link: "#"
    tagline: "Integrating immune profiling, cytokines, flow cytometry, myeloid-derived suppressor cell measurements, targeted sequencing, circulating tumor DNA, RNA-seq, medical imaging, and clinical outcomes to study immune remodeling and treatment-associated phenotypes."

  - title: Spatial omics and computational pathology
    link: "#"
    tagline: "Developing analysis workflows for spatial transcriptomics, spatial proteomics, cell-state annotation, cell-cell communication, tissue architecture, and pathology-informed molecular interpretation."

  - title: Computational tissue-state modeling
    link: "#"
    tagline: "Building probabilistic and machine-learning approaches for tissue composition, transition inference, uncertainty estimation, calibration, and interpretable biomarker discovery across imaging and molecular data."

