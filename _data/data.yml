career-profile:
    title: Career Profile
    summary: |
      Senior software engineer with 5+ years building production developer tooling for simulation software at Ansys (now Synopsys).
      I'm the main maintainer of [PyMAPDL](https://github.com/ansys/pymapdl) (500+ GitHub stars, 17,000+ monthly downloads), the open-source Python interface to the MAPDL solver, and the developer of [PyMAPDL MCP](https://github.com/ansys/pymapdl-mcp) (3,000+ monthly downloads).

      My work spans C++ solver code and gRPC services, Python APIs, Docker images, CI/CD and releases, and I care about testing: I took PyMAPDL's coverage from 70% to 90%. Lately I've also been building AI-assisted developer tooling, including MCP server integrations.

      Before industry I did a PhD in Civil Engineering (computational mechanics, FEM) at Swansea University and two research posts applying machine learning to materials and biomedical data at UCL and Swansea. That background means I'm comfortable where software meets numerical computing and messy real-world data.

