career-profile:
  title: Career Profile
  summary: |
    Biancamaria is a Doctoral Researcher in the Archaeogenomics group, 
    at the Institute of Genomics in the University of Tartu. Her main 
    interest is in the study of oral microbiome and oral microbial ecology of individuals 
    from different times and populations through the extraction of aDNA and proteins from 
    human dental calculus. She also works on other sources of aDNA (soil, bones, vessels) 
    and is involved in the development of new wet lab protocols for aDNA studies.
education:
  title: Education
  info:
  - degree: MSc (Hons) in Genetics and Molecular Biology
    university: Sapienza University of Rome
    time: 2018-2021
    
  - degree: BSc (Hons) in Biological Sciences
    university: Sapienza University of Rome
    time: 2015-2018
    
experiences:
  title: Experience
  info:
  - role: Doctoral researcher
    time: September 2021 - Present
    company: Estonian Biocentre, Institute of Genomics, University of Tartu
    details: |
      The main objective of the doctoral project is to assess the impact of cultural 
      differences on the quantitative and qualitative structure of the oral microbiome 
      within groups of European populations, from the Neolithic to post-industrial period .
      I am developing the wet lab protocols and analysing the sequenced data with in-house and published pipelines.
  - role: Erasmus+ Trainee
    time: April - July 2021
    company: Estonian Biocentre, Institute of Genomics, University of Tartu
    details: |
      Introduction to Ancient DNA Methods
      Traineeship Program: Learn how to produce ancient DNA NGS data from skeletal materials 
      by working in the ancient DNA lab alongside the lab technician; learn basic bioinformatic 
      analysis for processing DNA NGS data. The work was mainly focused on ancient dental calculus samples.
  - role: Postgraduate Researcher
    time: February - April 2021
    company: Sapienza University of Rome
    details: |
      Postgraduate Research Scholarship funded by the Pasteur Institute Italy-Cenci Bolognetti Foundation
      The project involved the analysis of experimental data generated through Next- Generation Sequencing (NGS).
  - role: Paid intern at Sapienza Museum Network (Polo Museale)
    time: 2018 - 2019
    company: Sapienza University of Rome
    details: |
      The activity included support of structured staff during events and conventions in which the 
      University was involved, the organisation of events related with the Museums of the University as well 
      as the creation and maintenance of the website of the Museum Network (Polo Museale) of Sapienza University.
  - role: Paid intern at Sapienza Anthropology Museum
    time: 2017 - 2018
    company: Sapienza University of Rome
    details: |
      The work activity was carried out at the Museum of Anthropology, Department of Environmental Biology 
      and involved computerised cataloging of bone specimens and materials, as well as conducting guided 
      tours within the museum.


