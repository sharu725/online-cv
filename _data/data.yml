experiences:
  title: Experience
  info:
  - role: Senior Site Reliability Engineer
    time: April, 2021 - Present
    company: Chase Bank
    details: |
      - Managed a team of SRE Engineers leveraging Agile processes and DevOps principles
      - Reduced virtual desktop operating costs by $3M through infrastructure refactoring and optimization
      - Implemented self-healing processes leveraging Camunda, PowerShell execution pools, and python
      - Wrote Flask and Django API’s to support SRE and DevOps efforts for automation and toil reduction
      - Rewrote in-house desktop support software from C# and PowerShell-based desktop client to cloud-ready API-driven web application interfacing with Splunk, ServiceNow, and Citrix Director
      - Improved error budgets and service level objectives (SLO) in the Citrix VDI space through increased telemetry and trend analysis
      - Leveraged Databricks, Spark SQL, Grafana, and Splunk to create executive-level dashboards displaying firm-wide Key Performance Indicators (KPI)
      - Collaborated with application developers to integrate UberAgent monitoring data into a new data and insights application suite
      - Integrated Django models with Cassandra and MySQL databases leveraging ORM
      - Increased application cloud-readiness by containerizing applications using Docker
      - Integrated token-based authorization to API endpoints leveraging Auth0
      - Automated CI/CD pipelines leveraging BitBucket, GitHub and Jenkins
  - role: Major Incident Manager
    time: January, 2018 – March, 2021
    company: Chase Bank
    details: |
      - Managed a team of SRE Engineers leveraging Agile processes and DevOps principles
      - Coordinated technical teams to resolve major incidents impacting multiple lines of business
      - Facilitated emergency change implementation within a global technology infrastructure
      - Managed critical milestone activities during high-severity technology incidents
      - Created Kanban workflows for Priority One Management process improvement
  - role: Infrastructure Engineer
    time: December, 2013 – December 2017
    company: Chase Bank
    details: |
      - Lead transition to Agile methodology as Scrum Master for Public Cloud Enablement team
      - Leveraged DevOps principles to assist developers with YAML and JSON Cloudformation templates
      - Created CD/CI pipeline to AWS Service Catalog utilizing Python, Boto3, Jenkins, and BitBucket
      - Automated Create/Read/Update/Delete (CRUD) processes for onboarding and offboarding users in a  time-critical, high-turnover application
      - Automated Private Key Infrastructure (PKI) certificate management for 3000 servers throughout the US
  - role: System Administrator
    time: April, 2011 - December, 2013
    company: Columbus Zoo and Aquarium
    details: |
      - Upgraded Microsoft Exchange 2003 to Microsoft Exchange 2010
      - Administered Microsoft Exchange for multiple departments in several campuses throughout Ohio
      - Migrated physical servers to Hyper-V infrastructure including Exchange, IIS and SQL environments
      - Automated cash room procedures, reducing cash counting errors and increasing staff efficiency
      - Created PowerShell scripts integrating vendor hardware, concession sales, and ticket data
      - Implemented diskless imaging procedure for workstation deployments
      - Migrated storage infrastructure to NetApp Network Attached Storage
