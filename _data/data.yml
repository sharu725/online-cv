career-profile:
  title: Bio
  summary: |
    I'm a computational biologist interested in systems immunology and multimodal models of tissue state. My work uses genomics, epigenomics, spatial transcriptomics, proteomics, computational pathology, medical imaging, and clinical outcomes to study how cellular systems organize, transition, and fail across disease contexts.

    I am an M.S. candidate in Bioinformatics at Johns Hopkins University and a Graduate Research Assistant in the [Advanced Computing and Oncology Laboratory](https://www.mskcc.org/research-areas/labs/members/abraham-aj-book) at Memorial Sloan Kettering Cancer Center. My current thesis project, [StageBridge](https://github.com/SecondBook5/StageBridge), models cell-state transitions from cross-sectional single-cell and spatial data using receiver-centered niche encoding, optimal transport, and conditional flow matching.

    Cancer is my main current application area, but not my only scientific identity. The broader problem that motivates me is how to build interpretable computational systems that connect molecular regulation, protein-state information, tissue architecture, immune context, and phenotype across modalities. I am especially drawn to methods that bridge systems biology, spatial biology, proteomics, and machine learning while remaining biologically testable.

current-focus:
  title: Current focus
  items:
  - title: StageBridge and spatial transition modeling
    description: My thesis work focuses on receiver-centered niche encoding for cell-state transitions from cross-sectional single-cell and spatial data, using lung adenocarcinoma progression as the first application.
  - title: Spatial deconvolution and atlas sensitivity
    description: I am working on benchmarking how deconvolution tools and reference atlases change spatial biology conclusions, especially in tumor and epithelial tissue contexts where downstream interpretation can depend heavily on the reference.
  - title: Multimodal immune-state analysis
    description: In my MSK work, I analyze combinations of imaging, clinical outcomes, sequencing, cytokines, flow cytometry, MDSC measurements, and immune validation data to connect tissue state with treatment response and toxicity.
  - title: Proteomics as a bridge between RNA state and function
    description: I am building more proteomics fluency into my work, especially spatial proteomics and mass-spectrometry-informed validation, because RNA-derived state models ultimately need protein-level interpretation and functional grounding.

projects:
  title: Selected projects
  intro: >
    Selected current and recent work across spatial systems biology, multimodal data integration, and interpretable computational modeling.
  assignments:
  - title: StageBridge
    link: "https://github.com/SecondBook5/StageBridge"
    tagline: "Receiver-centered niche encoding for cell-state transitions from cross-sectional single-cell and spatial data. StageBridge integrates spatial transcriptomics, single-nucleus RNA-seq, whole-exome sequencing, and dual-reference atlas context to connect epithelial transition dynamics with local immune, stromal, pathway, genomic, and tissue-neighborhood programs."

  - title: Spatial deconvolution and atlas-sensitivity benchmarking
    link: "#"
    tagline: "Benchmarking how deconvolution method choice and reference atlas choice change downstream biological conclusions in spatial transcriptomics, with emphasis on tissue-level interpretation rather than accuracy metrics alone."

  - title: Multimodal systems immunology workflows
    link: "#"
    tagline: "Integrating immune profiling, cytokines, flow cytometry, myeloid-derived suppressor cell measurements, targeted sequencing, circulating tumor DNA, RNA-seq, medical imaging, and clinical outcomes to study immune remodeling and treatment-associated phenotypes."

  - title: Spatial omics and computational pathology
    link: "#"
    tagline: "Developing analysis workflows for spatial transcriptomics, spatial proteomics, cell-state annotation, cell-cell communication, tissue architecture, and pathology-informed molecular interpretation."

  - title: Computational tissue-state modeling
    link: "#"
    tagline: "Building probabilistic and machine-learning approaches for tissue composition, transition inference, uncertainty estimation, calibration, and interpretable biomarker discovery across imaging and molecular data."

