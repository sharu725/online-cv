career-profile:
    title: Profil
    summary: |
      Ingénieur DevOps, SRE et Cloud Architect avec 4 ans d'expérience, spécialisé dans la conception et l'automatisation d'infrastructures hautement sécurisées, multi-datacenter et multi-cluster. Fort d'une expertise allant du bare-metal (L1) aux applications (L7), j'applique les principes Zero-Trust et l'IaC pour délivrer des environnements fiables et conformes aux exigences industrielles les plus strictes (ISO 27001). Passionné par l'innovation (IA, automatisation), j'aime travailler en équipe pour accroître l'efficacité collective.

