career-profile:
  title: Summary
  summary: |
    Senior Backend and Data Engineer specializing in Python, with a track record delivering production-grade backend systems and data-driven applications.

    Experienced in designing and implementing microservices, REST APIs, and serverless architectures on AWS, with a focus on scalability, performance, and reliability.

    Proven background in QA automation and test engineering, building robust automation frameworks and CI/CD practices that improve quality, speed of delivery, and system stability.

    Comfortable working across the stack of modern backend development with relational and vector databases, messaging systems, container orchestration, and cloud-native tooling, with hands-on exposure to RAG workflows and document processing.

