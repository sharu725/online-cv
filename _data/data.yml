oss:
  title: Open source contributions
  intro: >
    As a data professional, I recognize that many of the tools I rely on daily are powered by open-source software maintained by dedicated contributors. I strongly believe in the principles of open collaboration and transparency, and since 2020, I have been actively contributing to open-source projects.
  
  contributions:
    - title: "Cube.dev Prefect Collection"
      link: "https://alessandrolollo.github.io/prefect-cubejs/"
      tagline: "Prefect tasks to interact with Cube.dev APIs."
    - title: "SodaSQL Prefect Collection"
      link: "https://sodadata.github.io/prefect-soda-core/"
      tagline: "Prefect tasks to run Data Quality Checks using SodaSQL and SodaCL."
    - title: "Sifflet Prefect Collection"
      link: "https://siffletdata.github.io/prefect-sifflet/"
      tagline: "Prefect tasks to trigger Sifflet Data Quality rules."
    - title: "First version of dbt Cloud task for Prefect v1"
      link: "https://github.com/PrefectHQ/prefect/pull/5085"
      tagline: "Prefect v1 task to interact with dbt Cloud APIs."
    - title: "Other contributions to Prefect v1"
      link: "https://github.com/PrefectHQ/prefect/pulls?q=author%3Aalessandrolollo"
      tagline: "PRs I've contributed to Prefect since 2020."

