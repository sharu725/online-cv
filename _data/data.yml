career-profile:
  title: Career Profile
  summary: |
    I work with platform engineering and Azure, with a special interest in cloud computing.
    I see myself as a good all-rounder who enjoys combining hands-on technical skills with seeing the bigger picture.
    Microsoft Partner since May 2022.

education:
  title: Education
  info:
    - degree: BSc in IT Operations
      university: NTNU
      time: 2016 - 2019
      details: |
        Covered subjects such as operation and maintenance of computer systems (Windows and Linux),
        cloud services, system development, information security, virtual machines, and programming.

        My bachelor's thesis was titled "Modernization of a business-critical integration platform using containers in Azure Cloud".
        The project was part of a larger customer project assigned to Innofactor's department in Trondheim,
        which specializes in Microsoft Azure.

