career-profile:
  title: Bio
  summary: |
    I am a computational biologist working at the intersection of spatial regulatory biology, systems immunology, and cell-state dynamics. My central scientific interest is how regulatory programs—including transcription factors, RNA-binding proteins, microRNAs, and chromatin architecture—interact with immune and tissue context to determine which cellular states emerge, persist, transition, or fail in disease.

    I am an M.S. candidate in Bioinformatics at Johns Hopkins University and a Graduate Research Assistant in the [Advanced Computing and Oncology Laboratory](https://www.mskcc.org/research-areas/labs/members/abraham-aj-book) at Memorial Sloan Kettering Cancer Center. My thesis project, [StageBridge](https://github.com/SecondBook5/StageBridge), develops niche-conditioned models of cell-state transition from cross-sectional single-cell and spatial transcriptomic data. In parallel, my work at MSK integrates quantitative imaging, immune profiling, tumor genomics, circulating biomarkers, and clinical outcomes to study how host biology shapes treatment response and disease trajectory.

    Across these projects, I aim to move from static molecular description toward mechanistically interpretable models of biological change. I am especially interested in computational frameworks that connect gene-regulatory programs to spatial organization and cell-state transitions, and in universal differential equations and other hybrid mechanistic-learning approaches that can incorporate known biology while learning the dynamics that remain unknown. This is the research direction I intend to develop through Ph.D. training.

current-focus:
  title: Current focus
  items:
  - title: Spatial regulatory biology and cell-state dynamics
    description: I study how local niche context and regulatory programs shape cell-state transitions across premalignant, malignant, inflammatory, and tissue-remodeling settings. StageBridge is the current methodological foundation for this direction, combining receiver-centered niche representations with progression-aware transition modeling.
  - title: Systems immunology and host response
    description: Through HostBio and the broader thymic-reserve program, I investigate how systemic immune architecture and host tissue state modify treatment response, toxicity, recurrence, and survival. This work connects quantitative imaging with longitudinal immune phenotyping, tumor genomics, radiation exposure, and clinical outcomes across multiple lung cancer cohorts.
  - title: Collaborative disease biology
    description: I contribute computational analysis and model development to collaborations in secondary lymphedema, myasthenia gravis and thymoma, cGAS-STING biology, and head and neck squamous cell carcinoma. These projects provide complementary systems in which to study immune regulation, tissue remodeling, and disease-associated cell states.
  - title: Mechanistic models of biological dynamics
    description: A growing methods focus is the use of universal differential equations and other hybrid mechanistic-machine-learning models to represent biological systems whose governing structure is partly known but whose context-dependent dynamics must be learned from data.
  - title: Research software as scientific infrastructure
    description: I build reproducible, configuration-driven platforms for single-cell analysis, quantitative imaging, microbiome research, and cancer genomics. The goal is not software for its own sake, but infrastructure that makes complex biological questions auditable, scalable, and testable across datasets.

projects:
  title: Selected projects
  intro: >
    Together, these projects form a connected research program: learning how cell states are regulated in tissue context, quantifying host and immune biology from clinical data, and building rigorous computational infrastructure that can carry those questions across cohorts and modalities.
  assignments:
  - title: StageBridge
    link: "https://github.com/SecondBook5/StageBridge"
    tagline: "A thesis-driven framework for inferring how local immune and stromal niches reshape epithelial cell-state trajectories during lung adenocarcinoma progression. StageBridge integrates dual-reference atlas mapping, receiver-centered set representations, optimal transport, conditional flow matching, spatial transcriptomics, and evolutionary context to move beyond static stage comparisons toward niche-conditioned models of transition."

  - title: HostBio
    link: "https://github.com/Advanced-Computing-and-Oncology-Lab/HostBio"
    tagline: "A scalable platform for extracting biologically interpretable host phenotypes from routine CT and MRI. HostBio combines organ segmentation, scan-adaptive tissue-composition modeling, cohort-scale workflow orchestration, and quantitative quality control to measure thymic, muscle, liver, and tumor-associated states and connect them to immune function, treatment response, toxicity, and survival."

  - title: CellQuorum
    link: "https://github.com/SecondBook5/CellQuorum"
    tagline: "A reproducible, GPU-aware single-cell RNA-seq workflow engine built to make advanced analysis scalable without sacrificing auditability or scientific discipline. CellQuorum combines strict configuration validation, fail-loud data contracts, provenance tracking, backend-aware execution, ambient-RNA correction, quality control, normalization, integration, clustering, and annotation, with regulatory-network, communication, and trajectory modules under active development."

  - title: Thymus nnUNetv2 Segmentation
    link: "https://github.com/Advanced-Computing-and-Oncology-Lab/Thymus-nnUNetv2-Segmentation"
    tagline: "A pretrained five-fold nnUNetv2 framework for 3D thymus segmentation on thoracic CT, with standalone inference, fold-wise evaluation, quantitative metrics, multiplanar overlays, and GPU/CPU support. The model provides the segmentation backbone for scalable radiographic thymic phenotyping within HostBio."

  - title: Secondary Lymphedema Single-Cell Analysis
    link: "https://github.com/SecondBook5/lymphedema_keratinocyte_par2"
    tagline: "A collaboration with the Mehrara Lab using paired normal and lymphedematous human skin to resolve disease-associated keratinocyte states and tissue remodeling. The published PAR2 study established a keratinocyte-centered mechanism in secondary lymphedema; ongoing work extends the analysis across epithelial, immune, and stromal compartments with donor-aware inference and cross-dataset validation."

  - title: Dysbioscope
    link: "https://github.com/SecondBook5/Dysbioscope"
    tagline: "A collaboration with the Mehrara Lab and a reproducible multi-cohort framework for discovering convergent and context-dependent microbiome responses. Dysbioscope links raw 16S processing, dual taxonomic classification, compositional differential-abundance methods, functional prediction, cross-cohort concordance, and publication-grade visualization in a single Snakemake workflow."

  - title: Cosmic-IMPACT
    link: "https://github.com/SecondBook5/Cosmic-IMPACT"
    tagline: "A cancer-genomics toolkit that unifies MSK-IMPACT tissue sequencing and MSK-ACCESS cell-free DNA analysis. The platform integrates mutation annotation, tumor mutational burden, genomic instability, mutational signatures, clonality, driver discovery, ctDNA estimation, and longitudinal clonal-evolution summaries to connect genomic state with clinical trajectory. Research use only; not a clinical diagnostic tool."

