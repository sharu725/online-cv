projects:
  title: Projects
  intro: Selected product, platform, and AI/data engineering projects.
  assignments:
    - title: Talent–Job Matching RAG Platform
      tagline: Built a full-stack RAG platform that parses CVs and job descriptions with Claude, indexes them via hybrid retrieval (pgvector, BM25, reranker), and surfaces evidence-backed candidate↔role matches.
    - title: YouTube Summarizer
      tagline: Self-hosted full-stack app that turns long-form YouTube videos into searchable, taggable summaries with timestamps, per-video Q&A, and multi-format export.
    - title: Prompt Master — LLM Prompt-Engineering Platform
      tagline: End-to-end prompt-engineering platform covering authoring, versioning, critique, rewrite, execution, export, and cost visibility with CLI/UI parity.
    - title: Escheatment Legal Monitor — AI-Assisted Compliance Crawler
      tagline: AI-assisted compliance crawler monitoring all 50 US state unclaimed-property websites with change detection, escalation strategies, audit trail, and human approval workflow.
    - title: AI First Issuer Processing Platform
      tagline: Built platform capabilities around Cognito/IAM auth, Python and TypeScript services, GraphQL, and AWS serverless/data infrastructure.
    - title: Austrian Law RAG Application
      tagline: Legal RAG application for an Austrian law firm using OCR, LLM, NLP, FastAPI, Redis, and vector databases.
    - title: RAG Application for document classification
      tagline: Developed a RAG application for identifying and classifying documents using OCR and NLP services.
    - title: LSEG QA Automation and Data Integration
      tagline: QA automation and data integration for projects with 2000+ data sources using Python/PyTest, Azure Databricks, and Data Factory.
    - title: Siemens Energy QA Automation
      tagline: Backend and frontend QA automation frameworks for a blockchain-based Clean Energy Certificates platform using Python/PyTest and Dart/Flutter.
    - title: ID now
      tagline: Performance testing for ID Now's solution using Locust and Gatling, plus new Python features for QA automation frameworks with PyTest, Robot, and Jenkins.
    - title: Swibeco
      tagline: Performance testing and QA automation for an e-commerce platform using K6, Playwright, and TypeScript to improve UI/API validation and resolve bottlenecks.

