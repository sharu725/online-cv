name: Check Online CV loads successfully

on:
  pull_request:
    types: [opened, synchronize]

# Only one run allowed at a time
concurrency:
  group: webapp-verification
  cancel-in-progress: true

jobs:
  verify-webapp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker compose version || docker --version

      - name: Start services
        run: |
          docker compose up -d
          echo "Waiting for webapp to start..."
          for i in {1..30}; do
            if curl -fsS http://localhost:4000/ > /dev/null; then
              echo "✅ Webapp is up!"
              exit 0
            fi
            echo "⏳ Waiting for webapp... attempt $i"
            sleep 5
          done
          echo "❌ Webapp failed to start"
          docker compose logs
          exit 1

      - name: Healthcheck main page
        run: |
          echo "Checking main page..."
          curl -fsS http://localhost:4000/ | head -n 20

      - name: Tear down
        if: always()
        run: docker compose down