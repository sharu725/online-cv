name: Deploy Website

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # manual "Run workflow" button

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby # latest stable Ruby
          bundler-cache: true # bundle install from Gemfile.lock, cached between runs

      - name: Jekyll Build
        run: bundle exec jekyll build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::671370548051:role/github-deploy-online-cv
          aws-region: us-east-1

      - name: Copy files to the test website with the AWS CLI
        run: |
          aws s3 sync --delete ./_site s3://s3-chepeftw.com