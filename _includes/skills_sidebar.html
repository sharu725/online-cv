{% assign skills_sidebar = site.data.data.sidebar.skills_sidebar %}
{% if skills_sidebar %}
<div class="skills_sidebar-container container-block">

  <!-- Print main skills title -->
  <h1 class="container-block-title">
    {{ skills_sidebar.title }}
  </h1>

  <ul class="list-unstyled interests-list">
    {% for skill in skills_sidebar.info %}
    <li>
      <span class="lang-desc">{{ skill.level }}</span>&nbsp;&nbsp;&nbsp;&nbsp;{{ skill.idiom }}
    </li>
    {% endfor %}
  </ul>

</div><!--//skills-->
{% endif %}
